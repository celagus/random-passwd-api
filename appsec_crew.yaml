# AppSec Crew — local config for this repository (random-passwd-api).
#
# Upstream template to diff against when upgrading: celagus/appsec-crew `appsec_crew.yaml` at repo root.
# Packaged fallback (if this file were removed): `bundled_appsec_crew.yaml` inside the appsec_crew package.
#
# Precedence: non-empty YAML values override environment variables for secrets.
#
# CrewAI: every enabled agent needs `llm.api_key` or `llm.api_key_env`.
#
# PR vs batch: GitHub Actions sets `GITHUB_EVENT_NAME`. For local “PR mode” tests, set e.g.
#   export GITHUB_EVENT_NAME=pull_request
#   export APPSEC_CREW_PR_NUMBER=1
# (plus GITHUB_TOKEN, GITHUB_REPOSITORY). Batch mode: unset those or use schedule/workflow_dispatch.
#
# Tool-native configs in this repo:
#   - Betterleaks / Gitleaks: `.betterleaks.toml` or `.gitleaks.toml`
#   - OSV-Scanner: `osv-scanner.toml` — example starter: celagus/appsec-crew examples/osv-scanner.toml.example
#   - Semgrep: `.semgrep.yml` — example: celagus/appsec-crew examples/semgrep-local-rules.example.yml

global:
  # Minimum severity for dependency (CVSS) and Semgrep findings.
  # Values: critical | high | medium | low
  # NOTE: With `high`, only Semgrep findings at HIGH/CRITICAL/ERROR (or unlabeled → treated as HIGH) pass the
  # floor. Use `medium` if you expect more Semgrep noise from rules tagged MEDIUM.
  min_severity: medium
  github:
    token_env: GITHUB_TOKEN
    # token: use only if you must override GITHUB_TOKEN from a secret manager (never commit real tokens).

agents:
  secrets_reviewer:
    enabled: true
    llm:
      model: deepseek-chat
      api_key_env: OPENAI_API_KEY
      base_url: https://api.deepseek.com
      temperature: 0
    tools:
      betterleaks:
        binary: betterleaks
        version: v1.1.1
        config_path: null

  dependencies_reviewer:
    enabled: true
    llm:
      model: deepseek-chat
      api_key_env: OPENAI_API_KEY
      base_url: https://api.deepseek.com
      temperature: 0
    tools:
      osv_scanner:
        binary: osv-scanner
        version: v2.3.3
        config_path: null

  code_reviewer:
    enabled: true
    llm:
      model: deepseek-chat
      api_key_env: OPENAI_API_KEY
      base_url: https://api.deepseek.com
      temperature: 0
    tools:
      semgrep:
        binary: semgrep
        version: "1.156.0"
        config_path: null
        # LLM triage is off by default in appsec-crew; set `llm_triage: true` here to enable post-scan dismissal.
        extra_configs:
          - auto
          - p/security-audit
          - p/python
          - p/javascript
          - p/typescript
          - p/java
          - p/golang
          - p/rust

  reporter:
    enabled: true
    llm:
      model: deepseek-chat
      api_key_env: OPENAI_API_KEY
      base_url: https://api.deepseek.com
      temperature: 0
    tools:
      # In this template and in the bundled default: no Jira / webhook / Splunk.
      # Enable them here when you maintain your own `appsec_crew.yaml`.
      jira:
        enabled: false
        base_url: https://your-company.atlassian.net
        project_key: SEC
        issue_type: Task
        email_env: JIRA_EMAIL
        api_token_env: JIRA_API_TOKEN
      webhook:
        enabled: false
        url_env: APPSEC_WEBHOOK_URL
        url: ""
        headers: {}
        header_secrets: {}
      splunk:
        enabled: false
        hec_url_env: SPLUNK_HEC_URL
        hec_url: ""
        token_env: SPLUNK_HEC_TOKEN
        source: appsec_crew
        sourcetype: _json
