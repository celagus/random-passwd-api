# Runs AppSec Crew against this repository (PR, schedule, manual).
name: appsec-crew run

on:
  workflow_dispatch:
  pull_request:
#  schedule:
#    - cron: "0 6 * * 1"

concurrency:
  group: dogfood-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crew:
    uses: celagus/appsec-crew/.github/workflows/appsec-crew-reusable.yml@develop
    with:
      # This repo is not a copy of appsec-crew; install the package from GitHub.
      install_from_github: true
      appsec_crew_ref: develop
      scan_path: .
      config_file: ""
    secrets: inherit
